id: 7c664cb2-1b4e-419e-bd44-8bb51feeffeb
name: graphify-refresh
description: Rebuild the graphify knowledge graph (graphify-out/) - incremental extract, then name communities and write the report + HTML
tags: {}
vaults: [default]
inputs:
  properties:
    deep:
      type: boolean
      default: false
      description: Aggressive INFERRED-edge semantic extraction (more tokens)
    force:
      type: boolean
      default: false
      description: Full rebuild (graphify --force); needed when the graph legitimately shrinks and the shrink guard refuses to overwrite
    allowPartial:
      type: boolean
      default: false
      description: Overwrite graph.json even when the new graph is smaller than the existing one (graphify --allow-partial)
    tokenBudget:
      type: integer
      default: 60000
      description: Per-chunk token cap for the semantic pass; lower it if graphify reports files that "produced no nodes"
jobs:
  - name: main
    description: Extract then label
    steps:
      - name: extract
        description: Incremental AST + semantic extraction into graphify-out/graph.json
        task:
          type: behavior
          behavior: graphify
          methodName: extract
          inputs:
            deep: ${{ inputs.deep }}
            force: ${{ inputs.force }}
            allowPartial: ${{ inputs.allowPartial }}
            tokenBudget: ${{ inputs.tokenBudget }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: label
        description: Name communities, write GRAPH_REPORT.md and graph.html
        task:
          type: behavior
          behavior: graphify
          methodName: label
        dependsOn:
          - step: extract
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
